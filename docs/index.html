<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Keşfedio</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f0c1a;
      color: #e0d8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #1a1630;
      border: 1px solid #2e2750;
      border-radius: 20px;
      max-width: 600px;
      width: 100%;
      padding: 40px 36px;
    }
    .logo {
      font-size: 28px;
      font-weight: 800;
      color: #a78bfa;
      margin-bottom: 6px;
    }
    .subtitle {
      color: #7c6faa;
      font-size: 14px;
      margin-bottom: 32px;
    }
    p {
      color: #b0a0d0;
      font-size: 15px;
      line-height: 1.7;
      margin-bottom: 16px;
    }
    .links {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid #2e2750;
      display: flex;
      flex-direction: column;
      gap: 10px;
      font-size: 14px;
    }
    .links a {
      color: #a78bfa;
      text-decoration: none;
    }
    .contact {
      margin-top: 24px;
      font-size: 14px;
      color: #7c6faa;
    }
    .contact a {
      color: #a78bfa;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">Keşfedio</div>
    <div class="subtitle">Şehir Keşif Oyunu</div>

    <p>
      Keşfedio, şehrinizi keşfederek görevler tamamladığınız, rozet ve XP kazandığınız
      bir keşif oyunu uygulamasıdır.
    </p>

    <div class="links">
      <a href="hesap-silme.html">Hesap Silme Talimatları</a>
    </div>

    <div class="contact">
      İletişim: <a href="mailto:nalbantsoft@gmail.com">nalbantsoft@gmail.com</a>
    </div>
  </div>
</body>
</html>
